<!doctype html>
<html lang="ko" data-country="kr" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/home-night.css">
<link rel="stylesheet" href="../css/game-upgrade.css">
<link rel="stylesheet" href="../css/station-sign-ui.css">
<link rel="stylesheet" href="../css/station-sign-families.css">
<link rel="stylesheet" href="../css/osm-single-screen.css">
<link rel="stylesheet" href="../css/typing-fit-fixes.css">
<link rel="stylesheet" href="../css/korail-nameplate.css">
<link rel="stylesheet" href="../css/asset-runtime.css">
<link rel="stylesheet" href="../css/free-drive.css">
<link rel="stylesheet" href="../css/account-leaderboard.css">
<link rel="stylesheet" href="../css/service-picker-rebuild.css">
<link rel="stylesheet" href="../css/cloud-run-sync.css">
<link rel="stylesheet" href="../css/taiwan.css">
<link rel="stylesheet" href="../css/thailand.css">
<link rel="stylesheet" href="../css/kr-nameplate-overflow-fix.css">
<link rel="stylesheet" href="../css/enoden-nameplate.css">
<style>html,body{margin:0}</style>
</head>
<body data-current-screen="game">
<main><section id="screen-game" class="screen game-screen active" data-screen="game">
<div class="game-top"><button>종료</button><div><h2>江ノ島電鉄線</h2></div><div><button>일시정지</button></div></div>
<div class="service-summary"><div>기점</div><div>신창</div><div>종점</div></div>
<div class="hud-strip"><div>시간</div><div>진행</div><div>분당타수</div><div>정확도</div><div>콤보</div></div>
<div class="game-map-shell"><div id="route-map" class="route-map game-rail-map"></div></div>
<div class="station-sign-hud"><section id="station-sign" class="station-sign" style="--route-color:#c11d83" data-sign-style="enoden">
<div class="station-sign-strip"></div>
<div class="station-sign-brand"><div id="station-operator-mark"></div><span id="station-line-label"></span><span class="korail-sign-wordmark">KORAIL</span></div>
<div class="station-sign-main">
<div class="station-neighbor previous"><span class="korail-neighbor-badge">12</span><small>이전역</small><b>長谷</b><span>Hase</span><i>←</i></div>
<div class="station-current">
<p id="station-context">다음 역 입력</p>
<div id="station-badge" class="station-badge">13</div>
<h1 id="prompt-main">由比ヶ浜</h1>
<p id="prompt-ko" class="prompt-ko">유이가하마</p>
<p id="prompt-kana" class="prompt-kana">ゆいがはま</p>
<p id="prompt-sub" class="prompt-romaji">Yuigahama</p>
<div id="ko-progress" class="ko-progress"><span class="input-cell done">유</span><span class="input-cell"></span><span class="input-cell"></span><span class="input-cell"></span><span class="input-cell"></span></div>
<label class="typing-box station-sign-input"><input id="typing-input" aria-label="한국어 역명 입력" autocomplete="off" value="유"><span id="input-status">입력</span></label>
<button id="next-station-button" hidden>다음</button>
</div>
<div class="station-neighbor next"><span class="korail-neighbor-badge">14</span><small>다음역</small><b>和田塚</b><span>Wadazuka</span><i>→</i></div>
</div>
<div class="station-sign-footer"><span>오타 0</span><span>由比ヶ浜 · Yuigahama</span><span>에노덴 주행</span></div>
</section></div></section></main>
<script>
addEventListener('load',()=>{
 const s=document.getElementById('station-sign');
 const rect=sel=>document.querySelector(sel).getBoundingClientRect();
 const hud=rect('.station-sign-hud'),board=rect('#station-sign'),title=rect('#prompt-main'),main=rect('.station-current'),input=rect('.station-sign-input');
 const error=[];
 if(board.height>hud.height+4||board.bottom>hud.bottom+4)error.push('board outside HUD');
 if(title.width<30||title.height<24||title.top<main.top-2||title.bottom>main.bottom+3)error.push('Japanese station title clipped');
 // 현재 역명판은 조합 입력 필드를 투명하게 유지하고 한국어 진행 표시를 화면에 배치한다.
 const fieldStyle=getComputedStyle(document.querySelector('#typing-input'));
 if(Number(fieldStyle.opacity)===0){
  const progress=rect('#ko-progress');
  if(progress.width<30||progress.height<12||progress.top<title.bottom-1||progress.bottom>main.bottom+4)error.push('한국어 입력 진행 표시 잘림 또는 제목 겹침');
  if(fieldStyle.display==='none'||fieldStyle.visibility==='hidden'||rect('#typing-input').width<1)error.push('투명 조합 입력 필드가 사용 불가 상태');
 }else if(input.width<70||input.height<22||input.top<title.bottom-1||input.bottom>main.bottom+4)error.push('typing input clipped or overlaps title');
 const style=getComputedStyle(s),band=getComputedStyle(document.querySelector('.station-sign-strip'));
 if(!style.backgroundImage.includes('gradient'))error.push('Enoden gradient green missing');
 if(band.backgroundColor!=='rgb(239, 213, 76)'||band.height!=='5px')error.push('fixed thin yellow stripe missing');
 if(getComputedStyle(document.querySelector('.station-sign-brand')).display!=='none')error.push('old operator logo should be hidden');
 const badge=document.getElementById('station-badge');
 if(badge.textContent!=='13'||getComputedStyle(badge).display==='none')error.push('EN13 circle missing');
 if(!getComputedStyle(badge,'::before').content.includes('EN'))error.push('EN prefix missing');
 if(getComputedStyle(document.querySelector('.station-neighbor.previous .korail-neighbor-badge')).display==='none')error.push('previous EN12 missing');
 if(getComputedStyle(document.querySelector('.station-neighbor.next .korail-neighbor-badge')).display==='none'&&innerWidth>760)error.push('next EN14 missing');
 if(getComputedStyle(document.getElementById('prompt-main')).color!=='rgb(255, 255, 255)')error.push('station characters not white');
 const field=document.querySelector('#typing-input');
 field.focus();
 if(document.activeElement!==field)error.push('native input cannot receive keyboard focus');
 let fired=false;field.addEventListener('input',()=>fired=true);
 field.value='유이가하마';field.dispatchEvent(new Event('input',{bubbles:true}));
 if(!fired||field.value!=='유이가하마')error.push('Korean answer input is not working');
 document.documentElement.dataset.enodenResult=error.length?'FAIL':'PASS';
 document.documentElement.dataset.enodenErrors=error.join(' | ').replaceAll('"','');
});
</script></body></html>
