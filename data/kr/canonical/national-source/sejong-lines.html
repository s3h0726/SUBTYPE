	function sortBusRouteList(busRouteList){
		busRouteList.sort(function(firstRoute, secondRoute){
			var firstTypeOrder = isWideAreaRoute(firstRoute.route_type) ? 0 : 1;
			var secondTypeOrder = isWideAreaRoute(secondRoute.route_type) ? 0 : 1;
			
			if(firstTypeOrder != secondTypeOrder){
				return firstTypeOrder - secondTypeOrder;
			}
			
			if(firstRoute.route_name < secondRoute.route_name){
				return -1;
			}
			if(firstRoute.route_name > secondRoute.route_name){
				return 1;
			}
			if(firstRoute.route_id < secondRoute.route_id){
				return -1;
			}
			if(firstRoute.route_id > secondRoute.route_id){
				return 1;
			}
			return 0;
		});
	}

	function isWideAreaRoute(routeType){
		return routeType == 43 || routeType == 50 || routeType == 51 || routeType == 52 || routeType == 53;
	}
