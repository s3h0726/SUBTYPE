	<script>
		var searchControl = new searchControl();
		var searchText = '';
		var searchId = '';
		var searchType = "2"; // 1:기노선, 2:신규노선
		var selectRouteId;
		var busUpdateTimer;

		var siteUrl = new Array(
				"/search/line",
				"/search/station",
				"/search/route",
				"/search/realTimeBusLocation",
				"/search/similarLine"
				);
			
		function siteLink(url, parameters, options) {
			var popupOption = "fullscreen=no,menubar=yes,toolbar=yes,location=yes,scrollbars=yes, resizable=yes";
			window.open("" + url+(parameters?"?"+parameters:""), "", options ? options : popupOption);
		}

		function getQueryParameter(name) {
			const urlParams = new URLSearchParams(window.location.search);
			return urlParams.get(name);
		}

		//=========================================
		//화면이 완전히 로딩된 후 발생
		//=========================================
		$(document).ready(function() {
			var params = new URLSearchParams(window.location.search);
			var routeNum = params.get('routeNum');
			var routeId = params.get('routeId');

			const btnTimeElement = document.getElementById("btn_time");
			if (btnTimeElement) {
				btnTimeElement.value = routeId; // btn_time의 값 설정
			}

			// searchControl.lineSearchResultStationList(selectIdx);

			/*
			if(searchType == "1"){
				$(".text_newline").text("구노선정보");
			}else if(searchType == "2"){
				$(".text_newline").text("개편노선정보");
			}
			*/
			$('.scrollbar-outer').scrollbar();

			//지도 세팅 및 정류소 마커 이벤트 연결
			searchControl.init();

			//링크이동
			$(".first ul").on("click","li", function() {
				window.open(siteUrl[$(this).index()],"_self");
			});

			// 검색어 키워드가 있을 시
			if ( searchText ) {
				$(".btn_time").val(searchText);
				searchControl.lineSearchKeyword(searchText, searchType);
			}
			// 검색어 입력 후 엔터키 처리
			$(".btn_time").keydown(function(key) {
				if ( key.keyCode == 13 ) {
					lineKeyword = $(".btn_time").val();
					searchId = null;
					if ( lineKeyword == null || lineKeyword == '' ) {
						returnErrMsg("error.keyword.msg");
						return false;
					} else {
						searchControl.lineSearchKeyword(lineKeyword, searchType);
					}
				}
			});

			// 검색어 입력 후 서치버튼 클릭
			$(".right_input a").click(function() {
				lineKeyword = $(".btn_time").val();
				searchId = null;

				if ( lineKeyword == null || lineKeyword == '' ) {
					returnErrMsg("error.keyword.msg");
					return false;
				} else{
					searchControl.lineSearchKeyword(lineKeyword, searchType);
				}
			});

			// 노선 클릭
			$(".line_list").on("click", "li", function() {
				//클릭된 인덱스 가져옴
				var idx = $(this).index();

				// idx 0번은 셀렉트박스 목록 보여주기, 1부터는 노선선택
				if ( idx == 0 ) {
					searchControl.lineSearchResultInfo();
					// 실시간 버스위치 갱신 중지
					clearInterval(busUpdateTimer);
				} else {
					$(this).parent().css("height", "74px");
					$(this).parent().css("position", "absolute");
					$(this).parent().css("z-index", "5");

					// 검색결과 클릭 상태 세팅
					var title = $(this).find("p").eq(0).text();
					var path = $(this).find("p").eq(1).text();
					searchControl.lineSearchLineSelected(title, path);

					// SelectBox 선택 인덱스 0번은 title이기 때문에 -1 해줌
					var selectIdx = idx-1;

					// 경유정류소 뿌려줌
					searchControl.lineSearchResultStationList(selectIdx);

					// 경유노선 그리기
					var stationInfo = searchControl.searchResultInfo.get(selectIdx);
					selectRouteId = stationInfo.routeId;
					searchControl.setlineLink(selectRouteId);

					// 10초마다 한번씩 실시간 버스위치 갱신
					busUpdateTimer = setInterval(function() {
						var busType = searchControl.searchResultInfo.get(selectIdx).busTypeStr;
						searchControl.realTimeBusInfo(selectRouteId, busType);
					},30000);
				}
			});

			// 경유 정류소 선택 시
			$(".station_list").on("click", ".container", function(){
				// $(".infopopwrap").show();
				var selectIndex = $(this).index();
				searchControl.clickRouteStation(selectIndex, "line");
			});
		});
		
		//=========================================
		//MapEvent : 현재위치와 지도 zoom Level에 따른 정류장 마커 생성
		//=========================================
		function mapIdleEvent() {
			searchControl.setStationMaker();
		}
		
		//=========================================
		//MapEvent : 정류장 마커를 클릭했을 시 정보를 보여줌
		//=========================================
		function markerClickEvent() {
			searchControl.clickStationMaker(this);
		}
		
		//=========================================
		// ErrorMessage : 언어에 따라 메시지 출력
		//=========================================
		function returnErrMsg(codeId){
			console.log(codeId);
			var html = "";
			if(codeId == "error.keyword.msg")
				html = '검색어를 입력하세요.';
			
			alert(html);
			return false;
		}
	</script>
