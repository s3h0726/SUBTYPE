name: Refresh Korean name editor tables
on:
  push:
    paths:
      - 'reports/korean-names/editor.html'
      - '.github/workflows/refresh-korean-name-editor.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-korean-name-tables-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export current canonical names
        run: node tools/export-korean-names.js
      - name: Commit refreshed editor tables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/korean-names
          if ! git diff --cached --quiet; then
            git commit -m 'data(editor): refresh latest Korean names from canonical routes'
            git push
          fi
