name: Apply edited railway CSV to canonical sources
on:
  push:
    paths:
      - 'data/edited/lines-edited.csv'
      - 'tools/apply-lines-edited-csv.mjs'
      - '.github/workflows/apply-edited-rail-lines.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply CSV to canonical line files
        run: node tools/apply-lines-edited-csv.mjs
      - name: Regenerate Japanese runtime workspace
        run: node tools/build-line-workspaces.js
      - name: Review and publish updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lines data/operators data/generated js/line-workspace-data.js
          if git diff --cached --quiet; then
            echo 'No changes found.'
          else
            git commit -m 'data(jp): sync 603 edited lines with source workspaces and browser bundle'
            git push
          fi
