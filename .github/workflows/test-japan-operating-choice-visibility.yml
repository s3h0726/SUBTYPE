name: Japan operating-choice visibility regression
on:
  push:
    branches: [main]
    paths:
      - 'js/app.js'
      - 'js/app.bundle.js'
      - 'js/game.js'
      - 'js/route-integrity.js'
      - 'js/route-renderer.js'
      - 'js/japan-lite-index.js'
      - 'tools/test-hanshin-service-playability.cjs'
      - 'tools/test-japan-operating-choice-visibility.cjs'
      - 'tools/test-jp-catalog-existing-track-recovery.cjs'
      - 'tools/test-japan-physical-track-reuse.cjs'
      - 'tools/test-japan-shinkansen-services.cjs'
      - '.github/workflows/test-japan-operating-choice-visibility.yml'
  pull_request:
    paths:
      - 'js/app.js'
      - 'js/app.bundle.js'
      - 'js/game.js'
      - 'js/route-integrity.js'
      - 'js/route-renderer.js'
      - 'js/japan-lite-index.js'
      - 'tools/test-hanshin-service-playability.cjs'
      - '.github/workflows/test-japan-operating-choice-visibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operating-choices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and deployment JavaScript syntax
        run: |
          cp js/app.js /tmp/subtype-app-visibility.mjs
          node --check /tmp/subtype-app-visibility.mjs
          node --check js/app.bundle.js
          node --check tools/test-japan-operating-choice-visibility.cjs
          node --check tools/test-jp-catalog-existing-track-recovery.cjs
          node --check tools/test-japan-physical-track-reuse.cjs
          node --check tools/test-hanshin-service-playability.cjs
      - name: Verify all operating choices stay visible with safe launch guards
        run: node --test tools/test-japan-operating-choice-visibility.cjs
      - name: Verify Japanese catalog reuse of existing surveyed railway tracks
        run: |
          node tools/test-jp-catalog-existing-track-recovery.cjs
          node --test tools/test-japan-physical-track-reuse.cjs
      - name: Verify existing Hanshin services play without synthetic railway geometry
        run: node tools/test-hanshin-service-playability.cjs
      - name: Verify Shinkansen existing operating-service playability
        run: node tools/test-japan-shinkansen-services.cjs
