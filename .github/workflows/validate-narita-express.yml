name: Validate NEX branches and timetable evidence
on:
  push:
    branches: [main]
    paths:
      - 'data/lines/jr-east/narita-express/**'
      - 'data/generated/routes/line-11328.json'
      - 'tools/test-narita-express-services.js'
      - 'tools/build-nex-verified-geometry.js'
      - 'tools/test-nex-game-routes.cjs'
      - 'js/nex-route-resolver.js'
      - 'js/app.js'
      - 'tools/build-static.js'
      - '.github/workflows/validate-narita-express.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate service-branch stop sequences
        run: node tools/test-narita-express-services.js
      - name: Assemble physical railway branch geometries
        run: node tools/build-nex-verified-geometry.js
      - name: Verify 8 real NEX game journeys and correct branch geometry
        run: node tools/test-nex-game-routes.cjs
      - name: Rebuild playable site with NEX branch choices
        run: node tools/build-static.js
      - name: Verify bundled new route choices
        run: |
          node tools/test-nex-game-routes.cjs
          node - <<'NODE'
          const fs=require('fs');const bundle=fs.readFileSync('js/app.bundle.js','utf8');const data=fs.readFileSync('js/service-data.js','utf8');
          for(const marker of ['nexOperatingChoices','resolveNexOperatingChoice','nex-5-shinjuku','nex-14-ofuna','nex-2-shinjuku','nex-54-ofuna'])if(!bundle.includes(marker))throw Error('NEX game bundle missing '+marker);
          if(!data.includes('TRT_NEX_BRANCH_CANDIDATES')||!data.includes('stationGeometryIndices'))throw Error('NEX branch geometry absent from client data');
          NODE
      - name: Validate generated branch candidates
        run: |
          node -e "const x=require('./data/generated/nex-branch-geometry-candidates.json');if(x.releaseApproved!==false||x.variants.length!==2||x.variants.some(v=>v.geometry.length<100))process.exit(1);"
      - name: Commit verified-source geometry candidates without releasing them
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/nex-branch-geometry-candidates.json js/service-data.js js/app.bundle.js js/line-workspace-data.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(nex): publish train-specific Shinjuku/Ofuna railway routes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
