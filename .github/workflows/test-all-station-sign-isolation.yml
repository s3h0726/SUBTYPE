name: All-country station sign isolation
on:
  pull_request:
    paths:
      - 'js/rail-data-repository.js'
      - 'js/app.bundle.js'
      - 'js/data-loader.js'
      - 'index.html'
      - 'tools/test-all-station-sign-isolation.cjs'
      - '.github/workflows/test-all-station-sign-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'js/rail-data-repository.js'
      - 'js/app.bundle.js'
      - 'js/data-loader.js'
      - 'tools/test-all-station-sign-isolation.cjs'
      - '.github/workflows/test-all-station-sign-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  station-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check js/app.bundle.js
          node --check tools/test-all-station-sign-isolation.cjs
      - name: Verify all station signs, independent of shared transfer IDs
        run: node --test tools/test-all-station-sign-isolation.cjs
      - name: Verify Japan's named-interchange transfer and station switching
        run: node tools/test-jp-named-interchange-play.cjs
