name: Audit Korean railway timetables against official source bindings

on:
  push:
    branches: [audit/korean-rail-timetables-20261112]
    paths:
      - .github/workflows/kr-rail-timetable-audit.yml
      - tools/audit-kr-rail-timetable-20261112.cjs
      - data/kr/source/timetables/official-updates-20261112.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kr-rail-timetable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/korean-rail-timetables-20261112
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare 65 SeoulMetro services against actual station and train clocks
        run: node --test tools/test-kr-timetable-bindings.cjs
      - name: Audit published 55 rail cards and document v2 train-source scope
        run: node tools/audit-kr-rail-timetable-20261112.cjs
      - name: Commit generated audit documentation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/timetable-audit/KR_RAIL_TIMETABLE_AUDIT_20261112.md docs/timetable-audit/KR_RAIL_55_TIMETABLE_SCOPE.csv docs/timetable-audit/KR_SEOULMETRO_65_OFFICIAL_SOURCE_BINDINGS.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit(kr): publish official 65-pattern timetable review and 55 railway statuses"
            git push origin HEAD:audit/korean-rail-timetables-20261112
          fi
