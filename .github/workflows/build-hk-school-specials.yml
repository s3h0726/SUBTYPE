name: Build Hong Kong Light Rail school specials

on:
  push:
    paths:
      - '.github/workflows/build-hk-school-specials.yml'
      - 'tools/lib/hk-school-special-routes.cjs'
      - 'tools/build-hk-data.cjs'
      - 'tools/publish-hk-school-specials.cjs'
      - 'tools/review-hk-school-specials.cjs'
      - 'tools/test-hk-school-specials.cjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hk-school-specials-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build 506P and 720 in local preview state
        run: node tools/publish-hk-school-specials.cjs --validation-preview

      - name: Run real game typing engine for both routes
        run: node tools/review-hk-school-specials.cjs

      - name: Produce release-gated routes and editor index
        run: node tools/publish-hk-school-specials.cjs

      - name: Validate both routes and Hong Kong regressions
        run: |
          node --test tools/test-hk-school-specials.cjs
          # The full Hong Kong source compiler is deliberately not rerun:
          # stale historical gameplay fingerprints must not disable core lines.
          node tools/test-hk-editor-canonical-lines.cjs

      - name: Commit generated Hong Kong routes and evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hk/master/gameplay-review.json data/hk/generated/index.json data/hk/generated/routes/hk-light-rail-506p-school-morning.json data/hk/generated/routes/hk-light-rail-720-school-morning.json js/hong-kong-index-data.js index.html reports/hong-kong/completion/school-specials-20261122.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(hk): publish validated 506P and 720 special routes'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo 'Generated routes already synchronized.'
          fi
