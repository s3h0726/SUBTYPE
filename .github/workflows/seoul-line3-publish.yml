name: Seoul Line 3 real track release
on:
  push:
    branches: [main]
    paths:
      - 'data/kr/source/routes/kr-metro-3.json'
      - 'tools/apply-seoul-line-3-verified-geometry.js'
      - 'tools/test-line3-playability.js'
      - 'js/asset-renderer.js'
      - 'tools/validate-kr-published-geometry.mjs'
      - '.github/workflows/seoul-line3-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate 3호선 from durable original track source
        run: node tools/apply-seoul-line-3-verified-geometry.js
      - name: End-to-end route and OSM geometry tests
        run: |
          node tools/test-line3-playability.js
          node tools/validate-kr-published-geometry.mjs
      - name: Build versioned browser bundle
        run: node tools/build-app-bundle.js
      # Generation is verified against the source commit. Independent validation
      # jobs must not rebase/autostash or publish partial assets to main.
      - name: Verify generated deployment assets match the source commit
        run: git diff --exit-code -- data/kr/generated/routes/kr-metro-3.json data/kr/generated/index.json js/korea-index-data.js js/app.bundle.js index.html
      - uses: actions/upload-artifact@v4
        with:
          name: seoul-line3-publish-verified-assets
          path: |
            data/kr/generated/routes/kr-metro-3.json
            data/kr/generated/index.json
            js/korea-index-data.js
            js/app.bundle.js
            index.html
