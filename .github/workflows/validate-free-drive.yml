name: Validate free drive

on:
  push:
    branches: [main]
    paths:
      - 'js/free-drive.js'
      - 'js/app.js'
      - 'js/route-editor.js'
      - 'js/bootstrap.js'
      - 'css/free-drive.css'
      - 'index.html'
      - 'tools/build-static.js'
      - '.github/workflows/validate-free-drive.yml'
  workflow_dispatch:

concurrency:
  group: subtype-generated-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          cp js/free-drive.js /tmp/free-drive.mjs
          cp js/app.js /tmp/app.mjs
          cp js/route-editor.js /tmp/route-editor.mjs
          node --check /tmp/free-drive.mjs
          node --check /tmp/app.mjs
          node --check /tmp/route-editor.mjs
          node --check js/bootstrap.js
      - name: Rebuild static bundle
        run: node tools/build-static.js
      - name: Validate data
        run: node tools/validate-data.js
      - name: Verify free drive bundle
        run: |
          node --check js/app.bundle.js
          grep -q "class FreeDrive" js/app.bundle.js
          grep -q "screen-free-drive" index.html
          grep -q "home-network-canvas" index.html
      # Validate the source event without racing other workflows to rewrite main.
      # Runtime artifacts and their cache tags are committed together with source.
      - name: Verify committed application bundle matches source
        run: git diff --exit-code -- js/app.bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: validate-free-drive-build
          path: |
            js/app.bundle.js
            index.html
            data/generated/nex-branch-geometry-candidates.json
