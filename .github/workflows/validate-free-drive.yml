name: Validate free drive

on:
  push:
    branches: [main]
    paths:
      - 'js/free-drive.js'
      - 'js/app.js'
      - 'js/route-editor.js'
      - 'js/bootstrap.js'
      - 'css/free-drive.css'
      - 'index.html'
      - 'tools/build-static.js'
      - '.github/workflows/validate-free-drive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          cp js/free-drive.js /tmp/free-drive.mjs
          cp js/app.js /tmp/app.mjs
          cp js/route-editor.js /tmp/route-editor.mjs
          node --check /tmp/free-drive.mjs
          node --check /tmp/app.mjs
          node --check /tmp/route-editor.mjs
          node --check js/bootstrap.js
      - name: Rebuild static bundle
        run: node tools/build-static.js
      - name: Validate data
        run: node tools/validate-data.js
      - name: Verify free drive bundle
        run: |
          node --check js/app.bundle.js
          grep -q "class FreeDrive" js/app.bundle.js
          grep -q "screen-free-drive" index.html
          grep -q "home-network-canvas" index.html
      - name: Commit generated bundle
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.bundle.js js/line-workspace-data.js js/nationwide-data.js js/service-data.js js/line-theme-data.js js/line-badge-data.js js/rail-system-data.js index.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'build: enable nationwide free drive mode'
            git push origin HEAD:main
          fi
