name: Audit Japanese railway line grouping
on:
  push:
    paths:
      - 'tools/audit-japanese-line-grouping.cjs'
      - '.github/workflows/audit-japanese-line-grouping.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/audit-japanese-line-grouping.cjs
      - name: Publish full network grouping audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-audit/JAPANESE_LINE_GROUPING_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(jp): catalog split lines and overlapping service routes across national network'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
