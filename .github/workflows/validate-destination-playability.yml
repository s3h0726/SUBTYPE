name: Validate destination playability

on:
  push:
    branches: [main]
    paths:
      - 'js/app.js'
      - 'js/service-route-resolver.js'
      - '.github/workflows/validate-destination-playability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check app
        run: |
          cp js/app.js /tmp/app.mjs
          node --check /tmp/app.mjs
      - name: Rebuild static bundle
        run: node tools/build-static.js
      - name: Validate data
        run: node tools/validate-data.js
      - name: Commit rebuilt bundle
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.bundle.js index.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'build: apply destination playability fix'
            git push origin HEAD:main
          fi
