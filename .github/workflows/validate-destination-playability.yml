name: Validate destination playability

on:
  push:
    branches: [main]
    paths:
      - 'js/app.js'
      - 'js/service-route-resolver.js'
      - '.github/workflows/validate-destination-playability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check app
        run: |
          cp js/app.js /tmp/app.mjs
          node --check /tmp/app.mjs
      - name: Rebuild static bundle
        run: node tools/build-static.js
      - name: Validate data
        run: node tools/validate-data.js
      # Validate the source event without racing other workflows to rewrite main.
      # Runtime artifacts and their cache tags are committed together with source.
      - name: Verify committed application bundle matches source
        run: git diff --exit-code -- js/app.bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: validate-destination-playability-build
          path: |
            js/app.bundle.js
            index.html
            data/generated/nex-branch-geometry-candidates.json
