name: Verify Hong Kong route selection
on:
  push:
    branches: [main]
    paths:
      - 'js/app.js'
      - 'js/app.bundle.js'
      - 'index.html'
      - 'tools/test-hk-route-selector.cjs'
      - 'tools/test-japanese-route-color-order.cjs'
      - 'tools/test-japan-station-name-corrections.cjs'
      - 'tools/test-japan-namuwiki-policy.cjs'
      - 'data/japan-namuwiki-policy-corrections-20261102.json'
      - 'js/disney-resort-line-data.js'
      - 'data/japan-verified-station-name-corrections-20261101.json'
      - 'data/editor-overrides.json'
      - 'data/shared-stations/**'
      - 'data/generated/routes/**'
      - 'tools/test-hk-completion.cjs'
      - 'data/hk/**'
      - 'js/hong-kong-*.js'
      - '.github/workflows/test-hk-route-selector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser bundle syntax
        run: node --check js/app.bundle.js
      - name: Test HK MTR/TRAM, JP and KR route-card clicks
        run: node tools/test-hk-route-selector.cjs
      - name: Verify Japanese operator and RGB route-card order
        run: node tools/test-japanese-route-color-order.cjs
      - name: Verify Japanese Namuwiki station spelling corrections
        run: node tools/test-japan-station-name-corrections.cjs
      - name: Verify Japanese railway name policy and active station labels
        run: node tools/test-japan-namuwiki-policy.cjs
      - name: Verify Hong Kong Phase6 route data
        run: node tools/test-hk-phase6.cjs
      - name: Verify released Hong Kong source, geometry and actual-engine completion evidence
        run: node --test tools/test-hk-completion.cjs
