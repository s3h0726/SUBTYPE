name: Add current missing railway lines

on:
  push:
    branches: [main]
    paths:
      - 'tools/add-current-missing-lines.js'
      - '.github/workflows/add-current-missing-lines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-lines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add confirmed current missing lines
        run: node tools/add-current-missing-lines.js

      - name: Audit playability
        run: node tools/audit-playability.js

      - name: Build static data
        run: node tools/build-static.js

      - name: Commit generated line data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ js/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'data: add Hapi-Line, IR full route, and Kita-Osaka Kyuko'
            git push origin HEAD:main
          fi
