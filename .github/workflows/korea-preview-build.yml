name: Build and verify Korea production bundle

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'data/kr/**'
      - 'tools/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/korea-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Korea catalog
        run: |
          node tools/audit-kr-national-catalog.js
          node tools/test-kr-service-gating.js
          node tools/test-kr-geometry-gating.js
          node tools/validate-seoul-line-2-official-order.js
          node tools/test-seoul-line-2-rebuild.js
          node tools/validate-seoul-line-5-official-order.js
          node tools/apply-seoul-line-5-verified-geometry.js
          node tools/test-seoul-line-5-runtime.mjs
          node tools/validate-korea-data.js
          node tools/audit-korea-rebuild-baseline.js
      - name: Produce official verification report
        run: node tools/audit-kr-official-completeness.js
      - name: Build app and static data
        run: node tools/build-static.js
      - name: Verify Korean country feature in the bundle
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('js/app.bundle.js','utf8');if(!b.includes('korea:true'))throw new Error('Korea feature flag is absent from app.bundle.js')"
      - name: Commit generated production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.bundle.js js/korea-index-data.js js/line-workspace-data.js js/nationwide-data.js js/service-data.js js/line-theme-data.js js/line-badge-data.js js/rail-system-data.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(kr): synchronize production bundle [skip ci]"
            git push
          fi
