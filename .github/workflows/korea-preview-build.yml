name: Build Korea preview bundle
on:
  push:
    branches: [korea-network-rebuild-20261009]
    paths:
      - 'js/**'
      - 'data/kr/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/korea-preview-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Korea catalog
        run: |
          node tools/audit-kr-national-catalog.js
          node tools/test-kr-service-gating.js
          node tools/validate-korea-data.js
      - name: Build app and all required static data
        run: node tools/build-static.js
      - name: Verify new Korea feature flag was compiled into bundle
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('js/app.bundle.js','utf8');if(!b.includes('korea:true'))process.exit(1)"
      - name: Commit preview bundle on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.bundle.js js/korea-index-data.js js/line-workspace-data.js js/nationwide-data.js js/service-data.js js/line-theme-data.js js/line-badge-data.js js/rail-system-data.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(kr): synchronize Korean preview bundle [skip ci]"
            git push
          fi
