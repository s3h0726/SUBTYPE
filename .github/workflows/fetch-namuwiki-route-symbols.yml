name: Fetch NamuWiki route symbols

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-namuwiki-route-symbols.js'
      - '.github/workflows/fetch-namuwiki-route-symbols.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply NamuWiki symbol metadata
        run: node tools/apply-namuwiki-route-symbols.js

      - name: Fetch/canonicalize route symbols
        shell: bash
        run: |
          set -euo pipefail

          # Tokyo Metro — official SVG originals matching NamuWiki line symbols.
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20Ginza%20Line.svg' -o data/lines/tokyo-metro/ginza/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20Marunouchi%20Line.svg' -o data/lines/tokyo-metro/marunouchi-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20Marunouchi%20branch%20Line.svg' -o data/lines/tokyo-metro/marunouchi-honancho-branch/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20Hibiya%20Line.svg' -o data/lines/tokyo-metro/hibiya-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20T%C5%8Dzai%20Line.svg' -o data/lines/tokyo-metro/tozai-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20Chiyoda%20Line.svg' -o data/lines/tokyo-metro/chiyoda-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20Y%C5%ABrakuch%C5%8D%20Line.svg' -o data/lines/tokyo-metro/yurakucho-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20Hanz%C5%8Dmon%20Line.svg' -o data/lines/tokyo-metro/hanzomon-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20Namboku%20Line.svg' -o data/lines/tokyo-metro/namboku-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo%20of%20Tokyo%20Metro%20Fukutoshin%20Line.svg' -o data/lines/tokyo-metro/fukutoshin-line/symbol.svg

          # Toei: same official line symbols NamuWiki uses, downloaded from stable Wikimedia originals.
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Toei%20Asakusa%20line%20symbol.svg' -o data/lines/toei/asakusa-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Toei%20Mita%20line%20symbol.svg' -o data/lines/toei/mita-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Toei%20Shinjuku%20line%20symbol.svg' -o data/lines/toei/shinjuku-line/symbol.svg
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Toei%20Oedo%20line%20symbol.svg' -o data/lines/toei/oedo-line/symbol.svg

          # Sendai: reproduce NamuWiki SM-N.svg / SM-T.svg route marks with NamuWiki colors.
          cat > data/lines/sendaishikotsukyoku/sendaishieichikatetsunambokusen/symbol.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sendai Subway Namboku Line N">
            <circle cx="50" cy="50" r="44" fill="#fff" stroke="#317c66" stroke-width="10"/>
            <text x="50" y="66" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#317c66">N</text>
          </svg>
          SVG

          cat > data/lines/sendaishikotsukyoku/sendaishieichikatetsutozaisen/symbol.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sendai Subway Tozai Line T">
            <circle cx="50" cy="50" r="44" fill="#fff" stroke="#00b1dd" stroke-width="10"/>
            <text x="50" y="66" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#00b1dd">T</text>
          </svg>
          SVG

          for f in             data/lines/toei/asakusa-line/symbol.svg             data/lines/toei/mita-line/symbol.svg             data/lines/toei/shinjuku-line/symbol.svg             data/lines/toei/oedo-line/symbol.svg             data/lines/sendaishikotsukyoku/sendaishieichikatetsunambokusen/symbol.svg             data/lines/sendaishikotsukyoku/sendaishieichikatetsutozaisen/symbol.svg; do
            test -s "$f"
            grep -q '<svg' "$f"
          done

      - name: Rebuild
        run: node tools/build-static.js

      - name: Validate
        run: node tools/validate-data.js

      - name: Commit NamuWiki symbols
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lines/tokyo-metro/ data/lines/toei/ data/lines/sendaishikotsukyoku/ data/generated/asset-registry.json js/ index.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'assets: use NamuWiki route symbols for metro lines'
            git push origin HEAD:main
          fi
