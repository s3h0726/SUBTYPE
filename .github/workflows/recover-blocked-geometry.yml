name: Recover blocked railway geometry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-blocked-geometry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover missing railway geometry from OpenStreetMap
        run: |
          set -euo pipefail
          node tools/recover-osm-geometry.js --apply

      - name: Re-audit playability
        run: |
          set -euo pipefail
          node tools/audit-playability.js

      - name: Rebuild static railway data
        run: |
          set -euo pipefail
          node tools/build-static.js

      - name: Commit recovered geometry
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ js/
          if git diff --cached --quiet; then
            echo 'No recovered geometry changes to commit.'
          else
            git commit -m 'data: recover blocked railway geometry from OSM'
            git push origin HEAD:main
          fi
