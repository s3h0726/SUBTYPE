name: Route card density regression
on:
  push:
    branches: [main]
    paths: ['css/route-card-density.css','index.html','tools/test-route-card-density.cjs']
  pull_request:
    paths: ['css/route-card-density.css','index.html','tools/test-route-card-density.cjs']
jobs:
  compact-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/test-route-card-density.cjs
      - run: node tools/test-route-card-typography.cjs
      - run: node tools/test-native-route-card-names.cjs
