name: Publish SUBTYPE runtime to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish updated Hangang east canonical data']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: subtype-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check Hangang other-bus category is clean
        run: node tools/test-kr-hangang-other-bus.cjs
      - name: Verify KORAIL nameboard is installed for real KORAIL journeys
        run: node tools/test-korail-nameplate.cjs
      - name: Regression test free-drive station targeting
        run: node --test tools/test-free-drive-target-selection.cjs tools/test-free-drive-step-flow.cjs
      - name: 태국 공개 계통과 원자료 무결성 검증
        run: npm run test:thailand
      - name: Check responsive station sign with Chrome before publishing
        run: node --test tools/test-free-drive-layout-browser.cjs
      - name: Prevent clipped Korean station nameplates in production
        run: node --test tools/test-kr-nameplate-layout-browser.cjs
      - name: Build the current app bundle including country-wide name overrides
        run: node tools/build-app-bundle.js
      - run: node --check js/app.bundle.js
      - run: node tools/stage-pages.cjs
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - uses: actions/deploy-pages@v4
        id: deployment
