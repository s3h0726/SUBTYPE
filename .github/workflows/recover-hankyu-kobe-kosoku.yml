name: Recover Hankyu Kobe Kosoku actual track
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-hankyu-kobe-kosoku.yml
      - tools/recover-hankyu-kobe-kosoku-osm.py
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
concurrency:
  group: hankyu-kobe-kosoku-geometry
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original OSM underground rail ways and reconstruct all three segments
        if: ${{ !cancelled() }}
        run: python tools/recover-hankyu-kobe-kosoku-osm.py
      - name: Verify all three segments are actual sourced railway ways
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/generated/routes/line-hankyu-kobe-kosoku.json').read_text())['route']
          assert r['geometryReady'] and not r['missingSegments']
          assert len(r['stations'])==4 and len(r['directedSegments'])==3
          assert all(s['verified'] and len(s['geometry'])>=3 and 'OSM' in s['source'] for s in r['directedSegments'])
          print('PASS',len(r['geometry']),'geometry points')
          PY
          node tools/audit-recent-tram-and-kobe-geometry.js
      - name: Rebuild the embedded browser routes from canonical workspaces
        run: |
          node tools/build-line-workspaces.js
          node tools/audit-recent-tram-and-kobe-geometry.js
          node tools/test-single-source.js
      - name: Commit geometry and provenance to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lines/hankyudentetsu/hankyukobekosokusen/geometry.json data/generated/routes/line-hankyu-kobe-kosoku.json data/source-audit/HANKYU_KOBE_KOSOKU_OSM.json js/line-workspace-data.js data/generated/line-index.json data/generated/asset-registry.json data/generated/build-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply real underground OSM track geometry to Hankyu Kobe Kosoku"
            git push origin HEAD:main
          fi
