name: Audit JR line names

on:
  push:
    branches: [main]
    paths:
      - 'tools/audit-jr-line-names.js'
      - '.github/workflows/audit-jr-line-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build JR line-name audit
        run: node tools/audit-jr-line-names.js
      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-audit/JR_LINE_NAME_AUDIT.json
          if git diff --cached --quiet; then
            echo 'No audit changes.'
          else
            git commit -m 'audit: refresh JR line names'
            git push origin HEAD:main
          fi
