name: Line 1 actual-track and terminal playability QA
on:
  push:
    branches: [main]
    paths:
      - 'tools/test-line1-playability.js'
      - 'js/game.js'
      - 'js/service-route-resolver.js'
      - 'tools/apply-seoul-line-1-verified-geometry.js'
      - 'js/route-integrity.js'
      - 'data/kr/generated/routes/kr-metro-1-*.json'
      - 'data/kr/generated/index.json'
      - '.github/workflows/line1-playability-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  line1-game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate published Korean route index
        run: node tools/apply-seoul-line-1-verified-geometry.js
      - name: Verify OSM track station connectivity and all Line 1 service termini
        run: node tools/test-line1-playability.js
      - name: Publish updated bundled service patterns and Korean-only route labels
        run: node tools/build-app-bundle.js
      # Generation is verified against the source commit. Independent validation
      # jobs must not rebase/autostash or publish partial assets to main.
      - name: Verify generated deployment assets match the source commit
        run: git diff --exit-code -- js/app.bundle.js js/korea-index-data.js data/kr/generated/index.json index.html
      - uses: actions/upload-artifact@v4
        with:
          name: line1-playability-qa-verified-assets
          path: |
            js/app.bundle.js
            js/korea-index-data.js
            data/kr/generated/index.json
            index.html
