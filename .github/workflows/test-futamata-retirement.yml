name: Validate Futamata station retirement
on:
  push:
    paths:
      - 'data/lines/jr-hokkaido/hakodatehonsen-chomanbu-otaru/**'
      - 'data/generated/routes/line-11102.json'
      - 'js/japan-lite-index.js'
      - 'tools/test-futamata-retirement.cjs'
      - '.github/workflows/test-futamata-retirement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/test-futamata-retirement.cjs
