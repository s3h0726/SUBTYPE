name: Korean canonical transport catalog
on:
  push:
    branches: [main]
    paths: ['data/kr/**', 'tools/**', 'js/**', 'package.json', '.github/workflows/korea-rebuild.yml']
  pull_request:
    paths: ['data/kr/**', 'tools/**', 'js/**', 'package.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/build-kr-canonical.cjs --publish
      - run: node tools/test-kr-canonical.cjs
      - run: node --test tools/test-kr-road-binding.cjs
      - run: node tools/test-kr-busan-source.cjs --village
      - run: node tools/kr-provincial-gbis-test.cjs
      - run: node tools/test-kr-rail-expansion.cjs
      - run: node --test tools/test-taiwan.cjs
      - run: node --test tools/kr-rail-rebuild.test.cjs
      - run: node tools/kr-river-test.cjs
      - run: node tools/kr-bus-test.cjs
      - run: npm run test:typing
      - run: node tools/test-hk-route-selector.cjs
      - run: node tools/test-exact-duplicate-jp-routes.cjs
      - run: node tools/build-app-bundle.js
      - run: node --check js/app.bundle.js
      - name: Verify deterministic publication
        run: git diff --exit-code -- data/kr/generated/index.json data/kr/generated/routes js/korea-index-data.js js/app.bundle.js index.html
      - uses: actions/upload-artifact@v4
        with:
          name: korean-catalog-validation
          path: reports/kr-rebuild
