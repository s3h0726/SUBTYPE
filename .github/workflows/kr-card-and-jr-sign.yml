name: Korean card interaction and Korean transport signage
on:
  push:
    branches: [main]
    paths:
      - js/app.js
      - js/game.js
      - js/transport-stop-templates.js
      - js/station-sign-templates.js
      - css/enoden-nameplate.css
      - tools/test-enoden-nameplate.cjs
      - tools/test-enoden-nameplate-browser.cjs
      - tools/enoden-nameplate-layout-fixture.html
      - css/korail-nameplate.css
      - css/kr-nameplate-overflow-fix.css
      - tools/test-kr-nameplate-layout-browser.cjs
      - tools/kr-nameplate-layout-fixture.html
      - index.html
      - tools/test-korail-nameplate.cjs
      - .github/workflows/kr-card-and-jr-sign.yml
  pull_request:
    paths:
      - js/game.js
      - js/transport-stop-templates.js
      - js/station-sign-templates.js
      - css/enoden-nameplate.css
      - tools/test-enoden-nameplate.cjs
      - tools/test-enoden-nameplate-browser.cjs
      - tools/enoden-nameplate-layout-fixture.html
      - css/korail-nameplate.css
      - css/kr-nameplate-overflow-fix.css
      - tools/test-kr-nameplate-layout-browser.cjs
      - tools/kr-nameplate-layout-fixture.html
      - index.html
      - tools/test-korail-nameplate.cjs
      - .github/workflows/kr-card-and-jr-sign.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Korean card navigation and Korean transport signage
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const app=fs.readFileSync('js/app.js','utf8');
          const sign=fs.readFileSync('js/transport-stop-templates.js','utf8');
          if(app.includes('if(ok)openSetup(selected)'))throw Error('Korean card still jumps directly to setup');
          if(!app.includes('if(r){selectedGroup=null;void chooseRoute(r.id)}return'))throw Error('Korean card does not select preview');
          const context={};vm.createContext(context);
          vm.runInContext(fs.readFileSync('js/station-sign-templates.js','utf8').replace(/export /g,'')+';globalThis.resolveStationSignTemplate=resolveStationSignTemplate',context);
          vm.runInContext(sign.replace(/import[^;]+;/g,'').replace(/export /g,'')+';globalThis.resolveTransportStopTemplate=resolveTransportStopTemplate',context);
          for(const id of ['kr-seoul-metro','kr-korail','kr-shinbundang']) {
            const t=context.resolveTransportStopTemplate({countryId:'kr',mode:'commuter_rail',operatorId:id,category:'commuter_rail'});
            if(!['kr-seoul-metro','kr-korail','kr-shinbundang'].includes(t.style))throw Error('Korean rail sign missing for '+id);
          }
          const bus=context.resolveTransportStopTemplate({countryId:'kr',mode:'bus',operatorId:'kr-seoul-metro'});
          if(bus.style!=='kr-bus-stop')throw Error('Bus sign should not change');
          console.log('PASS: Korean cards select preview; Korean rail uses Korean signs; bus stays Korean');
          JS
          node tools/test-line1-playability.js
          node tools/test-korail-nameplate.cjs
          node tools/test-enoden-nameplate.cjs
          node --test tools/test-enoden-nameplate-browser.cjs
          node --test tools/test-kr-nameplate-layout-browser.cjs
      - name: Regenerate deployed app bundle
        run: node tools/build-app-bundle.js
      - name: Check complete shipped JavaScript for declaration collisions
        run: node --check js/app.bundle.js
      - name: Verify free-drive games still advance after nameplate updates
        run: node --test tools/test-free-drive-target-selection.cjs tools/test-free-drive-step-flow.cjs
      # Generation is verified against the source commit. Independent validation
      # jobs must not rebase/autostash or publish partial assets to main.
      - name: Verify generated deployment assets match the source commit
        run: git diff --exit-code -- js/app.bundle.js index.html
      - uses: actions/upload-artifact@v4
        with:
          name: kr-card-and-jr-sign-verified-assets
          path: |
            js/app.bundle.js
            index.html
