name: SUBTYPE integration staging gates
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/test-integrations-playwright.cjs'
      - 'tools/verify-supabase-records.cjs'
      - 'tools/verify-supabase-staging-write.cjs'
      - 'tools/fetch-osm-candidate.mjs'
      - 'tools/review-osm-route.mjs'
      - 'tools/audit-geometry-turf.mjs'
      - 'js/maplibre-adapter.js'
      - 'js/realtime-duel.js'
      - 'supabase/subtype-duel-prototype.sql'
      - 'integrations/**'
      - '.github/workflows/integrations-staging.yml'
permissions:
  contents: read
jobs:
  integration-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # SUBTYPE does not currently include a package-lock.json; npm ci would fail.
      # No lockfile or existing production dependencies are rewritten.
      - run: npm install --no-save --package-lock=false playwright@1.56.1 @turf/turf@7.4.0
      - run: npx playwright install --with-deps chromium
      - run: node --check tools/test-integrations-playwright.cjs
      - run: node --check tools/verify-supabase-records.cjs
      - run: node --check tools/verify-supabase-staging-write.cjs
      - run: node --check tools/fetch-osm-candidate.mjs
      - run: node --check tools/audit-geometry-turf.mjs
      - run: node --check tools/review-osm-route.mjs
      - run: node --check js/maplibre-adapter.js
      - run: node --check js/realtime-duel.js
      - run: node tools/audit-geometry-turf.mjs --input integrations/geometry-fixture.geojson
      - run: node --input-type=module -e "import {toMapLibreLine} from './js/maplibre-adapter.js'; const f=toMapLibreLine([[35,139],[35.01,139.01]]); if(f.geometry.coordinates[0][0]!==139) process.exit(1);"
      - run: node tools/test-integrations-playwright.cjs
  # Production Supabase data is NEVER modified by this workflow.
  # Read-only cloud test: run with a dedicated JWT via tools/verify-supabase-records.cjs.
