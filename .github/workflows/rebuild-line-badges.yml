name: Rebuild line badges

on:
  push:
    branches: [main]
    paths:
      - 'js/line-badge.js'
      - '.github/workflows/rebuild-line-badges.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          cp js/line-badge.js /tmp/line-badge.mjs
          node --check /tmp/line-badge.mjs
      - name: Rebuild
        run: node tools/build-static.js
      - name: Validate
        run: node tools/validate-data.js
      - name: Verify generated sources without concurrent push
        run: |
          echo 'Build and validation completed; generated artifacts are committed by the canonical build pipeline.'
