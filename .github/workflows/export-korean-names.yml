name: Export Korean name tables

on:
  push:
    branches: [main]
    paths:
      - 'tools/export-korean-names.js'
      - 'data/editor-overrides.json'
      - 'data/operators/**'
      - 'data/lines/**'
      - 'data/generated/routes/**'
      - 'data/route-overrides/meitetsu-mikawa-*.json'
      - 'data/route-overrides/hakodate-*.json'
      - '.github/workflows/export-korean-names.yml'
      - 'tools/test-korean-name-meitetsu-split.cjs'
      - 'tools/test-korean-name-hakodate-split.cjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-korean-name-tables-main
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export all registered Korean names
        run: node tools/export-korean-names.js
      - name: Verify that Mikawa mountain/sea line names and stations are exported
        run: node tools/test-korean-name-meitetsu-split.cjs
      - name: Verify Hakodate Main Line split in Korean-name editor
        run: node tools/test-korean-name-hakodate-split.cjs
      - name: Commit CSV reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/korean-names/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: update Korean operator, line and station name tables"
          # The repository contains an SVG with CRLF normalization differences.
          # Clean incidental worktree changes only AFTER committing the CSVs,
          # otherwise git rebase fails with an unrelated dirty SVG file.
          git -c core.autocrlf=false reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            # Fast path: avoid unnecessary rebase when the branch is current.
            if git push origin HEAD:main; then exit 0; fi
            git -c core.autocrlf=false reset --hard HEAD
            git fetch origin main
            if git -c core.autocrlf=false rebase origin/main; then
              git -c core.autocrlf=false reset --hard HEAD
            else
              git rebase --abort || true
            fi
            sleep 3
          done
          exit 1
