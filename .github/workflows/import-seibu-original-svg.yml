name: Import Seibu original SVGs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-seibu-original-svg.yml'

permissions:
  contents: write

jobs:
  import-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Seibu line symbols from Wikimedia Commons
        run: |
          set -euo pipefail
          mkdir -p assets/route-symbols
          curl -L --fail --silent --show-error 'https://commons.wikimedia.org/wiki/Special:Redirect/file/SeibuIkebukuro.svg' -o assets/route-symbols/seibu-si.svg
          curl -L --fail --silent --show-error 'https://commons.wikimedia.org/wiki/Special:Redirect/file/SeibuShinjuku.svg' -o assets/route-symbols/seibu-ss.svg
          curl -L --fail --silent --show-error 'https://commons.wikimedia.org/wiki/Special:Redirect/file/SeibuYamaguchi.svg' -o assets/route-symbols/seibu-sy.svg
          curl -L --fail --silent --show-error 'https://commons.wikimedia.org/wiki/Special:Redirect/file/SeibuKokubunji.svg' -o assets/route-symbols/seibu-sk.svg
          curl -L --fail --silent --show-error 'https://commons.wikimedia.org/wiki/Special:Redirect/file/SeibuTamako.svg' -o assets/route-symbols/seibu-st.svg
          curl -L --fail --silent --show-error 'https://commons.wikimedia.org/wiki/Special:Redirect/file/SeibuTamagawa.svg' -o assets/route-symbols/seibu-sw.svg

      - name: Wire Seibu runtime assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/line-badge-data.js')
          s = p.read_text(encoding='utf-8')

          # Fill missing Seibu route-code entries.
          s = s.replace('"line-22001":"SI","line-22003":"SI"', '"line-22001":"SI","line-22002":"SI","line-22003":"SI"')
          s = s.replace('"line-22004":"SI","line-22006":"SY"', '"line-22004":"SI","line-22005":"SI","line-22006":"SY"')

          marker = "  const odakyuOperator=makeAsset('./data/operators/odakyu/logo.svg','20260918');"
          block = """  const seibuOperator=makeAsset('./data/operators/seibu/logo.svg','20260918');
  const seibuSI=makeAsset('./assets/route-symbols/seibu-si.svg','20260918');
  const seibuSS=makeAsset('./assets/route-symbols/seibu-ss.svg','20260918');
  const seibuSY=makeAsset('./assets/route-symbols/seibu-sy.svg','20260918');
  const seibuSK=makeAsset('./assets/route-symbols/seibu-sk.svg','20260918');
  const seibuST=makeAsset('./assets/route-symbols/seibu-st.svg','20260918');
  const seibuSW=makeAsset('./assets/route-symbols/seibu-sw.svg','20260918');
  const seibuLines={
    'line-22001':seibuSI,
    'line-22002':seibuSI,
    'line-22003':seibuSI,
    'line-22004':seibuSI,
    'line-22005':seibuSI,
    'line-22006':seibuSY,
    'line-22007':seibuSS,
    'line-22008':seibuSS,
    'line-22009':seibuSK,
    'line-22010':seibuSK,
    'line-22011':seibuST,
    'line-22012':seibuSW
  };
  data.assets.operators.seibu=seibuOperator;
  Object.assign(data.assets.lines,seibuLines);

"""
          if 'const seibuOperator=' not in s:
              s = s.replace(marker, block + marker)

          loop_marker = "    if(route.operatorId==='odakyu') route.operatorAsset=odakyuOperator;"
          loop_block = """    if(route.operatorId==='seibu') route.operatorAsset=seibuOperator;
    if(seibuLines[route.id]){
      const asset=seibuLines[route.id];
      route.symbolAsset=asset;
      route.symbolMeta={...(route.symbolMeta||{}),asset:asset.asset,officialSymbolExists:true,verified:true,identificationSource:'wikimedia-commons',assetSource:'wikimedia-commons'};
      route.officialSymbolExists=true;
    }
"""
          if "if(route.operatorId==='seibu')" not in s:
              s = s.replace(loop_marker, loop_block + loop_marker)

          s = s.replace('Tokyu and Tobu line symbols are sourced from Wikimedia Commons file pages.', 'Tokyu and Tobu line symbols are sourced from Wikimedia Commons file pages. Seibu symbols are kept as local Commons copies.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit Seibu assets and runtime mapping
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/route-symbols/seibu-si.svg \
                  assets/route-symbols/seibu-ss.svg \
                  assets/route-symbols/seibu-sy.svg \
                  assets/route-symbols/seibu-sk.svg \
                  assets/route-symbols/seibu-st.svg \
                  assets/route-symbols/seibu-sw.svg \
                  js/line-badge-data.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add Seibu line symbols and runtime mapping'
            git push origin HEAD:main
          fi
