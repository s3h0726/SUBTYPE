name: Sync Hokuriku dual operators
on:
  push:
    paths:
      - 'tools/lib/line-workspaces.js'
      - 'data/lines/jr-east/hokuriku-shinkansen/line.json'
      - '.github/workflows/sync-hokuriku-operators.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-line-workspaces.js
      - run: |
          node -e "const r=require('./data/generated/routes/shinkansen-hokuriku.json').route;if(r.operator.ko!=='JR 동일본 / JR 서일본')throw Error('Dual operator label missing')"
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated js/line-workspace-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'build(jp): publish dual JR operator name for Hokuriku Shinkansen'
            git push
          fi
