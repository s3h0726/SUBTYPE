name: Rebuild record cards without logos
on:
  push:
    branches: [main]
    paths:
      - 'js/statistics.js'
      - 'js/app.js'
      - '.github/workflows/rebuild-record-cards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild application bundle
        run: node tools/build-static.js
      - name: Assert logos absent from record cards
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('js/app.bundle.js','utf8');for(const marker of ['record-operator-logo','record-line-symbol','recent-operator-logo','result-operator-logo-asset'])if(s.includes(marker))throw Error(marker+' still referenced');"
      # Generated runtime changes are committed with their source. A push from
      # an older workflow event races other main writers and can publish stale data.
      - name: Verify committed application bundle matches source
        run: git diff --exit-code -- js/app.bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: record-card-build
          path: |
            js/app.bundle.js
            js/line-workspace-data.js
