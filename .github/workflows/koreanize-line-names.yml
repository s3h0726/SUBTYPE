name: Koreanize railway line names

on:
  push:
    branches: [main]
    paths:
      - 'tools/koreanize-line-names.js'
      - '.github/workflows/koreanize-line-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Koreanize line names
        run: node tools/koreanize-line-names.js

      - name: Re-audit Korean names
        run: node tools/audit-japanese-korean-names.js

      - name: Validate data
        run: node tools/validate-data.js

      - name: Rebuild static data
        run: node tools/build-static.js

      - name: Commit normalized names
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ js/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'data: Koreanize railway line names batch 1'
            git push origin HEAD:main
          fi
