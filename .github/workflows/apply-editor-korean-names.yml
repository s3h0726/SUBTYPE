name: Apply Korean name editor to game data
on:
  push:
    branches: [main]
    paths:
      - 'data/editor-overrides.json'
      - 'tools/build-line-workspaces.js'
      - 'js/data-loader.js'
      - 'js/uk-network.js'
      - 'js/france-network.js'
      - 'tools/reconcile-editor-name-table.cjs'
      - 'tools/materialize-editor-names.cjs'
      - 'reports/korean-names/lines.csv'
      - 'reports/korean-names/operators.csv'
      - 'reports/korean-names/stations-by-line.csv'
      - 'tools/test-editor-station-runtime.cjs'
      - 'tools/test-editor-live-runtime.cjs'
      - 'tools/test-editor-interchange-names.cjs'
      - '.github/workflows/apply-editor-korean-names.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: korean-editor-publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify name synchronization scripts
        run: |
          node --check tools/reconcile-editor-name-table.cjs
          node --check tools/materialize-editor-names.cjs
      - name: Treat the published Korean name table as canonical
        run: node tools/reconcile-editor-name-table.cjs
      - name: Build complete application from reconciled sources
        run: node tools/build-static.js
      - name: Write names into the actual playable country catalogs and route data
        run: node tools/materialize-editor-names.cjs
      - name: Refresh bundle hashes after the final country data sync
        run: node tools/build-app-bundle.js
      - name: Verify the published name table matches gameplay route data
        run: node tools/reconcile-editor-name-table.cjs --check
      - name: Verify local editor drafts modify game name and typing objects
        run: node tools/test-editor-live-runtime.cjs
      - name: Verify route-specific names survive UK and France interchange handling
        run: node tools/test-editor-interchange-names.cjs
      - name: Validate editor names are present in built route catalog
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const editor=JSON.parse(fs.readFileSync('data/editor-overrides.json','utf8'));
          const index=JSON.parse(fs.readFileSync('data/generated/line-index.json','utf8'));
          const map=new Map(index.routes.map(route=>[route.id,route]));
          let names=0, stations=0;
          for(const [id,change] of Object.entries(editor.lines||{})){
            if(!map.has(id))continue;
            const route=map.get(id);
            if(change.ko&&route.line.ko!==change.ko)throw Error('line name mismatch: '+id);
            if(change.color&&/^#[0-9a-f]{6}$/i.test(change.color)&&route.lineColor.toLowerCase()!==change.color.toLowerCase())throw Error('line color mismatch: '+id);
            names++;
          }
          for(const [id,changes] of Object.entries(editor.stations||{})){
            if(!map.has(id))continue;
            const route=JSON.parse(fs.readFileSync('data/generated/routes/'+id+'.json','utf8')).route;
            for(const [stationId,ko] of Object.entries(changes)){
              const matches=route.stations.filter(st=>st.id===stationId||st.ja===stationId);
              if(!matches.length)throw Error('missing editor station '+id+':'+stationId);
              if(matches.some(st=>st.ko!==ko||st.routeSpecificStationName!==true||!st.canonicalStationNames))throw Error('runtime station name mismatch '+id+':'+stationId);
              stations++;
            }
          }
          console.log(JSON.stringify({verifiedRoutes:names,verifiedStations:stations}));
          NODE
      - name: Test resolved gameplay station names
        run: node tools/test-editor-station-runtime.cjs
      - name: Refresh public name editor rows from synchronized game data
        run: node tools/export-korean-names.js
      - name: Publish game-generated data only if validation passed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/editor-overrides.json data/operators/ data/lines/ data/shared-stations/ data/generated/ data/kr/generated/ data/hk/generated/ data/uk/generated/ data/fr/generated/ data/th/generated/ data/tw/generated/network.json data/route-overrides/ js/line-workspace-data.js js/korea-index-data.js js/hong-kong-index-data.js js/app.bundle.js js/nationwide-data.js index.html reports/korean-names/
          if git diff --cached --quiet; then echo 'No regenerated game data changes'; exit 0; fi
          git commit -m 'build(jp): synchronize Korean editor names with playable game'
          # Multiple Japan/Korea publishers update main concurrently. Never
          # drop a validated name build merely because main advanced mid-job.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git -c rebase.autoStash=true rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            # Generated files can conflict with another publisher's generated
            # bundle. Rebuild from its newer canonical main instead of forcing
            # a stale bundle over someone else's work.
            git reset --hard origin/main
            node tools/reconcile-editor-name-table.cjs
            node tools/build-static.js
            node tools/materialize-editor-names.cjs
            node tools/build-app-bundle.js
            node tools/reconcile-editor-name-table.cjs --check
            node tools/test-editor-live-runtime.cjs
            node tools/test-editor-interchange-names.cjs
            node tools/test-editor-station-runtime.cjs
            node tools/export-korean-names.js
            git add data/editor-overrides.json data/operators/ data/lines/ data/shared-stations/ data/generated/ data/kr/generated/ data/hk/generated/ data/uk/generated/ data/fr/generated/ data/th/generated/ data/tw/generated/network.json data/route-overrides/ js/line-workspace-data.js js/korea-index-data.js js/hong-kong-index-data.js js/app.bundle.js js/nationwide-data.js index.html reports/korean-names/
            if git diff --cached --quiet; then
              echo 'Latest main already contains the generated names'
              exit 0
            fi
            git commit -m 'build(jp): synchronize Korean editor names with playable game'
            sleep 2
          done
          echo 'Could not publish editor names after 5 attempts' >&2
          exit 1
