name: Tag SUBTYPE semantic version

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/version-tag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subtype-semver-tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify version and create immutable tag if absent
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          tag="v$version"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists; preserving original release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "SUBTYPE $tag"
          git push origin "refs/tags/$tag"
          echo "Created tag $tag at $(git rev-parse HEAD)"
