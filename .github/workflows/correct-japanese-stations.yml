name: Correct Japanese station Korean names
on:
  push:
    paths:
      - 'tools/correct-japanese-station-korean.mjs'
      - '.github/workflows/correct-japanese-stations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Japanese-script-qualified corrections
        run: node tools/correct-japanese-station-korean.mjs
      - name: Regenerate runtime and editing tables
        run: |
          node tools/build-line-workspaces.js
          node tools/export-korean-names.js
      - name: Commit corrected stations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shared-stations data/source-audit/STATION_KOREAN_CORRECTIONS_2026-10-11.json data/generated js/line-workspace-data.js reports/korean-names
          if ! git diff --cached --quiet; then
            git commit -m 'data(jp): correct qualified Korean station names and rebuild editing tables'
            git push
          fi
