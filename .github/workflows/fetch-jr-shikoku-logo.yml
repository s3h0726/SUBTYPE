name: Fetch JR Shikoku logo

on:
  push:
    branches: [main]
    paths:
      - 'data/operators/jr-shikoku/operator.json'
      - '.github/workflows/fetch-jr-shikoku-logo.yml'
      - 'js/line-badge.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch JR Shikoku logo
        run: |
          set -euo pipefail
          mkdir -p data/operators/jr-shikoku
          curl -L --fail --retry 3             'https://upload.wikimedia.org/wikipedia/commons/8/82/JR_logo_%28shikoku%29.svg'             -o data/operators/jr-shikoku/logo.svg
      - name: Rebuild static data
        run: node tools/build-static.js
      - name: Verify generated sources without concurrent push
        run: |
          echo 'Build and validation completed; generated artifacts are committed by the canonical build pipeline.'
