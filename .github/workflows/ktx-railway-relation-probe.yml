name: Diagnose official OSM Gyeongbu HSR route relation for Busan
on:
  push:
    branches: [diag/ktx-gyeongbu-relation-busan-20261118]
    paths:
      - 'tools/diag-ktx-gyeongbu-route-relation.cjs'
      - '.github/workflows/ktx-railway-relation-probe.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/diag-ktx-gyeongbu-route-relation.cjs
