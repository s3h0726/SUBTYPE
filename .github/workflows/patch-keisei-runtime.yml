name: Patch Keisei runtime symbols

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-keisei-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/line-badge-data.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"line-23003":"KS","line-23006":"KS"','"line-23003":"KS","line-23004":"KS","line-23005":"KS","line-23006":"KS"')
          s=s.replace('Tobu and Seibu line symbols are sourced from Wikimedia Commons file pages.','Tobu, Seibu and Keisei line symbols are sourced from Wikimedia Commons file pages.')
          marker="  const odakyuOperator=makeAsset('./data/operators/odakyu/logo.svg','20260918');"
          block="""  const keiseiOperator=makeAsset('./data/operators/keisei/logo.svg','20260918');
  const keiseiKS=commonsAsset('Number prefix Keisei.svg');
  const keiseiSkyAccess=commonsAsset('Number prefix SkyAccess.svg');
  const keiseiLines={
    'line-23001':keiseiKS,
    'line-23002':keiseiKS,
    'line-23003':keiseiKS,
    'line-23004':keiseiKS,
    'line-23005':keiseiKS,
    'line-23006':keiseiSkyAccess
  };
  data.assets.operators.keisei=keiseiOperator;
  Object.assign(data.assets.lines,keiseiLines);

"""
          if 'const keiseiOperator=' not in s:
              s=s.replace(marker,block+marker)
          loop_marker="    if(route.operatorId==='odakyu') route.operatorAsset=odakyuOperator;"
          loop_block="""    if(route.operatorId==='keisei') route.operatorAsset=keiseiOperator;
    if(keiseiLines[route.id]){
      const asset=keiseiLines[route.id];
      route.symbolAsset=asset;
      route.symbolMeta={...(route.symbolMeta||{}),asset:asset.asset,officialSymbolExists:true,verified:false,identificationSource:'wikimedia-commons',assetSource:'wikimedia-commons',assetSourceUrl:asset.source};
      route.officialSymbolExists=true;
    }
"""
          if "if(route.operatorId==='keisei')" not in s:
              s=s.replace(loop_marker,loop_block+loop_marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/line-badge-data.js
          git diff --cached --quiet || git commit -m 'Wire Keisei route symbols into runtime UI'
          git push origin HEAD:main
