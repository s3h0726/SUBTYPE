name: Add Hanshin Kobe Kosoku line

on:
  push:
    branches: [main]
    paths:
      - 'tools/add-hanshin-kobe-kosoku.js'
      - '.github/workflows/add-hanshin-kobe-kosoku.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-line:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Hanshin Kobe Kosoku
        run: node tools/add-hanshin-kobe-kosoku.js

      - name: Audit playability
        run: node tools/audit-playability.js

      - name: Rebuild static data
        run: node tools/build-static.js

      - name: Commit generated line
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ js/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'data: add Hanshin Kobe Kosoku line'
            git push origin HEAD:main
          fi
