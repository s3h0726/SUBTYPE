name: Verify UK operator short-turn services

on:
  push:
    branches: [audit/six-country-timetables]
    paths:
      - tools/apply-uk-verified-shortturns.cjs
      - tools/test-uk-verified-shortturns.cjs
      - tools/build-uk-regional.cjs
      - tools/report-uk-operator-timetable-coverage.cjs
      - tools/apply-uk-audited-operating-calendars.cjs
      - tools/test-uk-audited-operating-calendars.cjs
      - tools/audit-uk-all-56.cjs
      - tools/test-uk-all-56.cjs
      - tools/apply-uk-service-day-rules.cjs
      - data/uk/source/timetables/uk-56-official-sources.json
      - data/uk/source/timetables/uk-56-train-time-samples.json
      - data/uk/source/timetables/uk-56-service-day-rules.json
      - data/uk/source/timetables/metrolink-2026-operator-windows.json
      - data/uk/source/timetables/elizabeth-2026-sampled-journey.json
      - .github/workflows/uk-timetable-shortturns.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/six-country-timetables
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply seven reviewed UK services to the real game data
        run: node tools/apply-uk-verified-shortturns.cjs
      - name: Apply official TfGM calendars and TfL published train column
        run: node tools/apply-uk-audited-operating-calendars.cjs
      - name: Check original route, real geometry, runtime selection, source time and idempotency
        run: node --test tools/test-uk-verified-shortturns.cjs
      - name: Record operator Waterloo and Glasgow service-day schedules
        run: node tools/apply-uk-service-day-rules.cjs
      - name: Validate Metrolink operating windows and TfL sampled train against game stops
        run: node --test tools/test-uk-audited-operating-calendars.cjs
      - name: Validate all UK directions against real OSM tracks
        run: node tools/test-uk-rail.cjs
      - name: Audit all 56 official source links and 291 UK route directions
        run: node tools/test-uk-all-56.cjs
      - name: Publish route data and UK validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uk/generated/routes/uk-edinburgh-trams.json data/uk/generated/routes/uk-net-hucknall-toton.json data/uk/generated/routes/uk-net-phoenix-clifton.json data/uk/generated/index.json data/uk/generated/validation.json docs/timetable-audit/UK_ROUTE_AUDIT_56.csv data/uk/generated/routes/uk-metrolink.json data/uk/generated/routes/uk-elizabeth.json data/uk/generated/routes/uk-waterloo-city.json data/uk/generated/routes/uk-glasgow-subway.json docs/timetable-audit/UK_TIMETABLE_AUDIT_291_DIRECTIONS.csv docs/timetable-audit/UK_OFFICIAL_TRAIN_TIME_SAMPLES.csv docs/timetable-audit/UK_ALL_56_TIMETABLE_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "feat(uk): publish seven operator-confirmed short-turn services"
            git push origin HEAD:audit/six-country-timetables
          fi
