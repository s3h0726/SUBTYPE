name: Validate UK railway expansion
on:
  push:
    branches: [feature/uk-railway-expansion, feature/uk-railway-completion, main]
    paths: ['data/uk/**', 'js/**', 'css/uk-rail.css', 'tools/*uk*', 'tools/lib/uk-*.cjs', '.github/workflows/validate-uk-rail.yml']
  pull_request:
    paths: ['data/uk/**', 'js/**', 'css/uk-rail.css', 'tools/*uk*', 'tools/lib/uk-track-graph.cjs']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/build-uk-regional.cjs > /tmp/uk-build.json
      - run: git diff --exit-code -- data/uk/generated
      - run: node --test tools/test-uk-track-graph.cjs tools/test-uk-osm.cjs tools/test-uk-free-drive.cjs
      - run: node tools/test-uk-rail.cjs && node tools/test-uk-leaderboard.cjs
      - run: node tools/build-app-bundle.js && node --check js/app.bundle.js
      - name: Install pinned browser test harness
        run: npm install --prefix "$RUNNER_TEMP/uk-playwright" --no-package-lock playwright@1.62.1
      - name: Complete every UK service in Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/uk-playwright/node_modules/playwright" node tools/test-uk-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: uk-validation, path: reports/uk}
