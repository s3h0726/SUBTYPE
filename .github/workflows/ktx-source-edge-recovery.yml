name: Verify KTX source-edge provenance after geometry repair
on:
  push:
    branches: [fix/ktx-source-edge-provenance-20261118]
    paths:
      - 'tools/rebuild-ktx-source-edge-refs.cjs'
      - 'tools/build-kr-canonical.cjs'
      - '.github/workflows/ktx-source-edge-recovery.yml'
permissions:
  contents: write
jobs:
  reprove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct every corrected KTX geometry-edge provenance record
        run: |
          node --check tools/rebuild-ktx-source-edge-refs.cjs
          node tools/rebuild-ktx-source-edge-refs.cjs --write
      - name: Publish proven route payloads with immutable station identities
        run: node tools/build-kr-canonical.cjs --publish
      - name: Verify each changed canonical rail batch against original OSM way endpoints
        run: |
          node tools/test-kr-rail-expansion.cjs --batch=rail-continuity-recovery-batch.json
          node tools/test-kr-rail-expansion.cjs --batch=rail-national-recovery-batch.json
          node tools/test-kr-rail-expansion.cjs --batch=rail-network-recovery-batch.json
      - name: Validate canonical catalog and corrected KTX geometry
        run: |
          node tools/test-kr-canonical.cjs
          node tools/audit-kr-ktx-track-alignment.cjs
      - name: Commit repaired source proofs and regenerated route payloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kr/canonical/rail-*-batch.json data/kr/generated/routes/ data/kr/generated/index.json js/korea-index-data.js reports/kr-ktx-source-edge-proofs-20261118.json reports/kr-rebuild/catalog-validation.json reports/kr-ktx-track-alignment.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(kr): restore exact OSM edge proof per corrected KTX geometry vertex'
            git push origin HEAD:fix/ktx-source-edge-provenance-20261118
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ktx-source-proof
          path: reports/kr-ktx-source-edge-proofs-20261118.json
          if-no-files-found: warn
