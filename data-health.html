<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tokyo Rail Typing · Data Health</title><link rel="stylesheet" href="./css/base.css"><style>body{margin:0;background:#08120f;color:#edf5f0;font-family:system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:48px 24px}a{color:#58d99a}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.card,.panel{border:1px solid #30423b;border-radius:14px;background:#101d18;padding:20px}.card b{display:block;color:#58d99a;font:800 30px ui-monospace}.card small{color:#91a39b}.ok{color:#58d99a}.warn{color:#f3bf54}.logos{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.logo{display:grid;place-items:center;min-height:90px;border:1px solid #30423b;border-radius:10px;background:#fff;color:#15221d;text-decoration:none;padding:8px;text-align:center}.logo img{max-width:84px;max-height:42px}.logo small{margin-top:6px;font-size:9px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.logos{grid-template-columns:repeat(3,1fr)}}</style></head>
<body><main class="wrap"><div class="head"><div><p>DEVELOPER REPORT · 2026-08-23</p><h1>RAIL SYSTEM DATA AUDIT</h1></div><a href="./index.html">게임으로 돌아가기 →</a></div><div id="summary" class="grid"></div><section class="panel"><h2>전국 통합 판정</h2><p id="audit-status" class="warn">감사 데이터를 불러오는 중입니다.</p><p class="ok">✓ 전국 인덱스와 노선별 지연 로딩 청크가 분리되어 첫 화면에서 전체 역 데이터를 읽지 않습니다.</p><p class="warn">△ 한국어 자동 음역은 공식 관용 표기와 다를 수 있으며 수동 검수 대상을 별도 파일에 기록합니다.</p><p class="warn">△ 재배포 조건을 확인하지 못한 노선 심볼은 임의 원형 로고로 대체하지 않고 텍스트 코드로 표시합니다.</p></section><section class="panel"><h2>운영사 식별 자산 <span id="logo-count"></span></h2><div id="logos" class="logos"></div></section></main>
<script src="./js/rail-data.js"></script><script src="./js/service-data.js"></script><script src="./js/line-theme-data.js"></script><script src="./js/operator-asset-data.js"></script><script src="./js/route-symbol-data.js"></script><script src="./js/rail-system-data.js"></script><script>(async()=>{const a=Object.values(window.TRT_OPERATOR_ASSETS||{}),[audit,ui]=await Promise.all([fetch('./data/nationwide/FINAL_AUDIT.json').then(r=>r.json()),fetch('./data/nationwide/UI_AUDIT.json').then(r=>r.json())]),cards=[['NATIONWIDE LINES',audit.scope.lines],['OPERATORS',audit.scope.operators],['UNIQUE STATIONS',audit.scope.uniqueStations],['LAZY CHUNKS',audit.scope.routeChunks],['MLIT GEOMETRY',`${audit.geometry.matched}/${audit.scope.lines}`],['GEOMETRY MISSING',audit.geometry.missing],['NAME REVIEW',audit.names.humanReviewRequired],['KOREAN FIELD FLAGS',audit.names.japaneseCharactersInKorean],['REAL SYMBOL ASSETS',audit.symbols.realAssets],['OPERATOR LOGO COVERAGE',`${ui.logos.operatorsWithVerifiedLocalAssets}/${ui.logos.nationwideOperators}`],['UI ENGINE CHECKS',`${ui.typingEngine.criticalChecksPassed}/${ui.typingEngine.criticalChecksTotal}`],['STRICT PASS',audit.strictPass?'YES':'NO']];document.querySelector('#summary').innerHTML=cards.map(([k,v])=>`<div class="card"><small>${k}</small><b>${v}</b></div>`).join('');document.querySelector('#audit-status').textContent=`${audit.status}: ${audit.blockers.join(' ')} ${ui.blockers.join(' ')}`;document.querySelector('#logo-count').textContent=`${ui.logos.operatorsWithVerifiedLocalAssets}/${ui.logos.nationwideOperators} operators`;document.querySelector('#logos').innerHTML=a.map(x=>`<a class="logo" href="${x.source}" target="_blank" rel="noopener"><img src="${x.asset}" alt="${x.label}"><small>${x.label}</small></a>`).join('')})().catch(error=>{document.querySelector('#audit-status').textContent=`감사 파일 로드 실패: ${error.message}`})</script></body></html>
