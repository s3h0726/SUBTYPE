<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUBTYPE · 태국 한국어 이름 편집표</title>
<style>:root{font:15px system-ui,'Malgun Gothic',sans-serif;color:#12202c;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#12273b;color:white;padding:24px}main{max-width:1400px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}a{color:inherit}button,input{font:inherit;padding:10px;border:1px solid #c9d4df;border-radius:7px}button{cursor:pointer;background:white;color:#18374e}button[aria-selected=true]{background:#163e5f;color:white}#query{flex:1;min-width:180px}#wrap{max-height:70vh;overflow:auto;background:white}table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#e9f0f5}td,th{padding:10px;border:1px solid #dbe4eb;text-align:left}td input{width:100%;min-width:180px}small{display:block;color:#64778b}#status{line-height:1.6}@media(prefers-color-scheme:dark){:root{color:#e6edf3;background:#111923}#wrap,button{background:#172536;color:#e6edf3}th{background:#23374e}td,th{border-color:#344858}input{background:#12202c;color:#e6edf3}}</style>
<header><h1>태국 한국어 이름 편집표</h1><a href="./editor.html">전체 국가 편집표</a> · <a href="../../index.html#home">게임으로 돌아가기</a><p>수정값은 이 브라우저의 태국 노선 선택·입력 정답·행선지·역명판에 즉시 반영됩니다.</p></header>
<main><nav id="tabs" aria-label="편집 대상"><button data-kind="operators">운영사</button><button data-kind="lines">노선</button><button data-kind="stations">역·행선지</button><button data-kind="services">운행계통</button></nav><nav><input id="query" type="search" placeholder="한국어·태국어·영어·식별자 검색"><button id="export">수정값 JSON 내보내기</button><button id="restore">현재 분류 기본값 복원</button></nav><p id="status" role="status">자료 읽는 중…</p><div id="wrap"><table><thead><tr><th>식별자</th><th>한국어 이름</th><th>태국어 원명</th><th>영어 이름</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
'use strict';
const KEY='subtype-thai-names-v1',escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let catalog={},kind='stations',edits={};
try{edits=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
const get=row=>row.names||row,ko=row=>{const value=edits[kind]?.[row.id];return(typeof value==='string'?value:value?.ko)||get(row).ko||''};
function render(){document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.kind===kind)));const q=document.getElementById('query').value.toLocaleLowerCase(),rows=(catalog[kind]||[]).filter(row=>JSON.stringify({...row,edited:ko(row)}).toLocaleLowerCase().includes(q));document.getElementById('rows').innerHTML=rows.map(row=>{const n=get(row);return'<tr><td><small>'+escape(row.id)+'</small></td><td><input data-id="'+escape(row.id)+'" value="'+escape(ko(row))+'" aria-label="'+escape(n.ko)+' 한국어 이름"></td><td lang="th">'+escape(n.th)+'</td><td lang="en">'+escape(n.en)+'</td></tr>'}).join('');document.getElementById('status').textContent='총 '+rows.length+'건 · 한국어 입력 정답을 변경합니다. 역 이름을 바꾸면 해당 역을 사용하는 모든 행선지도 함께 바뀝니다.';}
document.getElementById('tabs').onclick=e=>{if(e.target.dataset.kind){kind=e.target.dataset.kind;render()}};document.getElementById('query').oninput=render;
document.getElementById('rows').oninput=e=>{const id=e.target.dataset.id,value=e.target.value.normalize('NFC').trim();if(!id)return;if(!/[가-힣]/.test(value)){document.getElementById('status').textContent='한국어 이름을 한 글자 이상 입력하세요. 이 값은 아직 저장하지 않았습니다.';return}edits[kind]??={};edits[kind][id]=kind==='lines'?{ko:value}:value;localStorage.setItem(KEY,JSON.stringify(edits));document.getElementById('status').textContent='저장했습니다. 열려 있는 게임 화면에도 반영됩니다.';};
document.getElementById('restore').onclick=()=>{delete edits[kind];localStorage.setItem(KEY,JSON.stringify(edits));render()};document.getElementById('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({countryId:'th',schemaVersion:1,...edits},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='thailand-korean-overrides.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
fetch('../../data/th/generated/names.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{catalog=data;render()}).catch(e=>document.getElementById('status').textContent='자료를 불러오지 못했습니다: '+e.message);
</script></html>
